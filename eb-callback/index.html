<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Autorizaci&oacute;n recibida &#x2705;</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f6f8;
    color: #1c2430;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(20, 40, 70, 0.08);
    max-width: 560px;
    width: 100%;
    padding: 36px 28px;
    text-align: center;
  }
  h1 { font-size: 1.5rem; margin-bottom: 20px; }
  .msg { font-size: 1.1rem; line-height: 1.5; margin-bottom: 20px; }
  .code-box {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.95rem;
    background: #eef2f6;
    border: 1px solid #d5dde5;
    border-radius: 10px;
    padding: 16px;
    word-break: break-all;
    margin-bottom: 16px;
    text-align: left;
    user-select: all;
  }
  button {
    font-size: 1rem;
    font-weight: 600;
    background: #1a7f4e;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 14px 28px;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
  .error-title { color: #b3261e; }
  .error-detail {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9rem;
    background: #fdeeee;
    border: 1px solid #f0c8c6;
    border-radius: 10px;
    padding: 14px;
    word-break: break-all;
    text-align: left;
  }
  .muted { color: #5a6675; font-size: 0.95rem; line-height: 1.5; }
  .copied { background: #14603b; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div id="view-code" class="hidden">
      <h1>Autorizaci&oacute;n recibida &#x2705;</h1>
      <p class="msg"><strong>Autorizaci&oacute;n completada.</strong> Copia este c&oacute;digo y p&eacute;gaselo a Lagun en el chat:</p>
      <div id="code-box" class="code-box"></div>
      <button id="copy-btn" type="button">Copiar c&oacute;digo</button>
    </div>

    <div id="view-error" class="hidden">
      <h1 class="error-title">Algo fall&oacute; en la autorizaci&oacute;n</h1>
      <div id="error-detail" class="error-detail"></div>
    </div>

    <div id="view-empty" class="hidden">
      <h1>Autorizaci&oacute;n bancaria</h1>
      <p class="muted">Esta p&aacute;gina recoge la autorizaci&oacute;n de tu banco. Si has llegado aqu&iacute; sin venir del banco, no hay nada que hacer.</p>
    </div>
  </div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var error = params.get('error');

  function show(id) { document.getElementById(id).classList.remove('hidden'); }

  if (code) {
    document.getElementById('code-box').textContent = code;
    show('view-code');
    var btn = document.getElementById('copy-btn');
    btn.addEventListener('click', function () {
      function ok() {
        btn.textContent = 'Copiado ✓';
        btn.classList.add('copied');
        setTimeout(function () {
          btn.textContent = 'Copiar código';
          btn.classList.remove('copied');
        }, 2000);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(ok, function () { fallbackCopy(); });
      } else {
        fallbackCopy();
      }
      function fallbackCopy() {
        var ta = document.createElement('textarea');
        ta.value = code;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); ok(); } catch (e) {}
        document.body.removeChild(ta);
      }
    });
  } else if (error) {
    var desc = params.get('error_description');
    document.getElementById('error-detail').textContent = desc ? (error + ': ' + desc) : error;
    show('view-error');
  } else {
    show('view-empty');
  }
})();
</script>
</body>
</html>
