<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="lab-title" content="Rande - Iconos preview">
<meta name="lab-subtitle" content="Opciones de favicon / apple-touch-icon">
<meta name="lab-section" content="Salud">
<meta name="lab-icon" content="&#x1F3A8;">
<script src="/guard.js"></script>
<title>Rande · Iconos preview</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Inter",sans-serif;background:#f5f7fa;color:#1a2330;padding:32px 16px;min-height:100vh}
  h1{font-size:22px;font-weight:800;margin-bottom:6px}
  p.sub{color:#5a6878;font-size:14px;margin-bottom:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px;max-width:900px;margin:0 auto}
  .card{background:#fff;border-radius:18px;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .icon{width:120px;height:120px;border-radius:26px;margin:0 auto 12px;display:block;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .title{font-weight:700;font-size:14px;margin-bottom:2px}
  .desc{font-size:12px;color:#5a6878}
  .header{max-width:900px;margin:0 auto}
</style>
</head>
<body>
  <div class="header">
    <h1>Iconos para Batalla de Rande</h1>
    <p class="sub">Vista con el borde redondeado tipo iOS. Dime qué número prefieres.</p>
  </div>
  <div class="grid">
    <div class="card"><img class="icon" src="/rande-icons/option1_current.png"><div class="title">1 · RANDE + sol</div><div class="desc">Actual</div></div>
    <div class="card"><img class="icon" src="/rande-icons/option2_27km.png"><div class="title">2 · 27 minimalista</div><div class="desc">Big number</div></div>
    <div class="card"><img class="icon" src="/rande-icons/option3_monogram.png"><div class="title">3 · BR monograma</div><div class="desc">Marca</div></div>
    <div class="card"><img class="icon" src="/rande-icons/option4_wave.png"><div class="title">4 · Onda gigante</div><div class="desc">RANDE 2026</div></div>
    <div class="card"><img class="icon" src="/rande-icons/option5_sunset.png"><div class="title">5 · Atardecer</div><div class="desc">Cálido</div></div>
    <div class="card"><img class="icon" src="/rande-icons/option6_depth.png"><div class="title">6 · Sonar 27</div><div class="desc">Técnico</div></div>
  </div>
</body>
</html>
