<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload &mdash; Lab Aldamiz</title>
    <script src="/guard.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 60px 24px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #86868b;
            font-size: 1rem;
            margin-bottom: 32px;
        }
        .upload-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .token-banner {
            background: #fffbeb;
            border: 1.5px solid #f59e0b;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 24px;
            text-align: center;
        }
        .token-banner p {
            font-size: 0.92rem;
            color: #92400e;
            margin-bottom: 12px;
        }
        .token-banner input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #d2d2d7;
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: monospace;
            outline: none;
            margin-bottom: 10px;
        }
        .token-banner input:focus {
            border-color: #f59e0b;
        }
        .token-banner button {
            padding: 10px 24px;
            background: #1d1d1f;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
        }
        .token-banner button:hover { background: #333; }
        .token-saved {
            background: #f0fdf4;
            border: 1.5px solid #86efac;
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.88rem;
            color: #166534;
        }
        .token-saved button {
            background: none;
            border: none;
            color: #86868b;
            cursor: pointer;
            font-size: 0.82rem;
            text-decoration: underline;
        }
        .drop-zone {
            border: 2px dashed #d2d2d7;
            border-radius: 12px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #0071e3;
            background: #f0f7ff;
        }
        .drop-zone-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }
        .drop-zone-text {
            color: #86868b;
            font-size: 0.95rem;
        }
        .drop-zone-text strong {
            color: #0071e3;
        }
        .file-info {
            display: none;
            background: #f5f5f7;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 24px;
            align-items: center;
            gap: 12px;
        }
        .file-info.visible {
            display: flex;
        }
        .file-icon { font-size: 1.5rem; }
        .file-details { flex: 1; }
        .file-name { font-weight: 600; font-size: 0.95rem; }
        .file-size { color: #86868b; font-size: 0.82rem; }
        .file-remove {
            background: none;
            border: none;
            color: #86868b;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px 8px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #86868b;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .form-group select, .form-group input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #d2d2d7;
            border-radius: 10px;
            font-size: 0.95rem;
            background: #fafafa;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group select:focus, .form-group input[type="text"]:focus {
            border-color: #0071e3;
            background: #fff;
        }
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row .form-group { flex: 1; }
        .separator {
            border: none;
            border-top: 1px solid #e8e8ed;
            margin: 24px 0;
        }
        .section-title {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #86868b;
            margin-bottom: 16px;
        }
        .btn-upload {
            width: 100%;
            padding: 14px;
            background: #1d1d1f;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-upload:hover { background: #333; }
        .btn-upload:disabled {
            background: #d2d2d7;
            cursor: not-allowed;
        }
        .status {
            margin-top: 16px;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 0.92rem;
            display: none;
        }
        .status.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
        }
        .status.error {
            display: block;
            background: #ffeef0;
            color: #d32f2f;
        }
        .status.loading {
            display: block;
            background: #e3f2fd;
            color: #1565c0;
        }
        .status a {
            color: inherit;
            font-weight: 600;
        }
        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #0071e3;
            text-decoration: none;
            font-size: 0.92rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload</h1>
        <p class="subtitle">Sube archivos HTML a lab.aldamiz.com</p>

        <div class="upload-card">
            <div class="token-banner" id="tokenBanner" style="display:none;">
                <p>Primera vez? Pega tu GitHub token para conectar con el repositorio. Solo tienes que hacerlo una vez.</p>
                <input type="text" id="tokenInput" placeholder="github_pat_...">
                <button id="tokenSave">Guardar token</button>
            </div>

            <div class="token-saved" id="tokenSaved" style="display:none;">
                Token configurado &check;
                <button id="tokenChange">Cambiar</button>
            </div>

            <div class="drop-zone" id="dropZone">
                <div class="drop-zone-icon">&#x1F4C4;</div>
                <div class="drop-zone-text">
                    Arrastra un archivo HTML aqu&iacute; o <strong>haz clic para seleccionar</strong>
                </div>
                <input type="file" id="fileInput" accept=".html,.htm" style="display:none">
            </div>

            <div class="file-info" id="fileInfo">
                <span class="file-icon">&#x1F4C4;</span>
                <div class="file-details">
                    <div class="file-name" id="fileName"></div>
                    <div class="file-size" id="fileSize"></div>
                </div>
                <button class="file-remove" id="fileRemove">&times;</button>
            </div>

            <div class="section-title">Archivo</div>

            <div class="form-row">
                <div class="form-group">
                    <label>Nombre del archivo</label>
                    <input type="text" id="destName" placeholder="mi-pagina.html">
                </div>
                <div class="form-group">
                    <label>Carpeta</label>
                    <select id="destFolder">
                        <option value="">/ (ra&iacute;z)</option>
                        <option value="private/">private/</option>
                    </select>
                </div>
            </div>

            <hr class="separator">
            <div class="section-title">Index</div>

            <div class="form-group">
                <label>T&iacute;tulo en el index</label>
                <input type="text" id="indexTitle" placeholder="Mi dashboard">
            </div>
            <div class="form-group">
                <label>Subt&iacute;tulo</label>
                <input type="text" id="indexSubtitle" placeholder="Descripci&oacute;n corta">
            </div>
            <div class="form-group">
                <label>Secci&oacute;n</label>
                <select id="indexSection">
                    <option value="Salud">Salud</option>
                    <option value="Utilities">Utilities</option>
                </select>
            </div>

            <button class="btn-upload" id="btnUpload" disabled>Subir y a&ntilde;adir al index</button>

            <div class="status" id="status"></div>
        </div>

        <a href="index.html" class="back-link">&larr; Volver al Lab</a>
    </div>

    <script>
        function getToken() {
            return localStorage.getItem('lab_gh_token') || '';
        }
        function setToken(t) {
            localStorage.setItem('lab_gh_token', t);
        }
        function removeToken() {
            localStorage.removeItem('lab_gh_token');
        }

        const CONFIG = {
            get token() { return getToken(); },
            owner: 'aldamiz',
            repo: 'aldamiz-lab',
            branch: 'main'
        };

        const SECTION_ICONS = {
            'Salud': '&#x1FA78;',
            'Utilities': '&#x1F527;'
        };

        const tokenBanner = document.getElementById('tokenBanner');
        const tokenSaved = document.getElementById('tokenSaved');
        const tokenInput = document.getElementById('tokenInput');
        const tokenSaveBtn = document.getElementById('tokenSave');
        const tokenChangeBtn = document.getElementById('tokenChange');

        function showTokenUI() {
            if (getToken()) {
                tokenBanner.style.display = 'none';
                tokenSaved.style.display = 'flex';
            } else {
                tokenBanner.style.display = 'block';
                tokenSaved.style.display = 'none';
            }
        }
        showTokenUI();

        tokenSaveBtn.addEventListener('click', function() {
            var t = tokenInput.value.trim();
            if (!t) return;
            setToken(t);
            tokenInput.value = '';
            showTokenUI();
        });

        tokenChangeBtn.addEventListener('click', function() {
            removeToken();
            showTokenUI();
        });

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const fileRemove = document.getElementById('fileRemove');
        const destName = document.getElementById('destName');
        const destFolder = document.getElementById('destFolder');
        const indexTitle = document.getElementById('indexTitle');
        const indexSubtitle = document.getElementById('indexSubtitle');
        const indexSection = document.getElementById('indexSection');
        const btnUpload = document.getElementById('btnUpload');
        const status = document.getElementById('status');

        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) handleFile(fileInput.files[0]);
        });
        fileRemove.addEventListener('click', clearFile);

        function handleFile(file) {
            if (!file.name.match(/\.html?$/i)) {
                showStatus('Solo se permiten archivos .html', 'error');
                return;
            }
            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatSize(file.size);
            fileInfo.classList.add('visible');
            destName.value = file.name;
            var baseName = file.name.replace(/\.html?$/i, '').replace(/[-_]/g, ' ');
            indexTitle.value = baseName.charAt(0).toUpperCase() + baseName.slice(1);
            btnUpload.disabled = false;
            status.style.display = 'none';
            var metaReader = new FileReader();
            metaReader.onload = function() {
                var doc = new DOMParser().parseFromString(metaReader.result, 'text/html');
                var mt = doc.querySelector('meta[name="lab-title"]');
                var ms = doc.querySelector('meta[name="lab-subtitle"]');
                var mc = doc.querySelector('meta[name="lab-section"]');
                if (mt) indexTitle.value = mt.getAttribute('content');
                if (ms) indexSubtitle.value = ms.getAttribute('content');
                if (mc) indexSection.value = mc.getAttribute('content');
            };
            metaReader.readAsText(file);
        }

        function clearFile() {
            selectedFile = null;
            fileInfo.classList.remove('visible');
            fileInput.value = '';
            destName.value = '';
            indexTitle.value = '';
            indexSubtitle.value = '';
            btnUpload.disabled = true;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function showStatus(msg, type) {
            status.className = 'status ' + type;
            status.innerHTML = msg;
        }

        async function ghGet(path) {
            var res = await fetch('https://api.github.com/repos/' + CONFIG.owner + '/' + CONFIG.repo + '/contents/' + path + '?ref=' + CONFIG.branch, {
                headers: { 'Authorization': 'Bearer ' + CONFIG.token }
            });
            if (!res.ok) return null;
            return res.json();
        }

        async function ghPut(path, content, sha, message) {
            var body = { message: message, content: content, branch: CONFIG.branch };
            if (sha) body.sha = sha;
            var res = await fetch('https://api.github.com/repos/' + CONFIG.owner + '/' + CONFIG.repo + '/contents/' + path, {
                method: 'PUT',
                headers: {
                    'Authorization': 'Bearer ' + CONFIG.token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                var err = await res.json();
                throw new Error(err.message || 'GitHub API error');
            }
            return res.json();
        }

        function buildIndexEntry(href, icon, title, subtitle) {
            return '            <li>\n                <a href="' + href + '">\n                    <span class="page-icon">' + icon + '</span>\n                    <div class="page-info">\n                        <div class="page-title">' + title + '</div>\n                        <div class="page-desc">' + subtitle + '</div>\n                    </div>\n                    <span class="page-arrow">&rsaquo;</span>\n                </a>\n            </li>';
        }

        async function updateIndex(filePath, title, subtitle, section) {
            var indexData = await ghGet('index.html');
            if (!indexData) throw new Error('No se pudo leer index.html');

            var html = decodeURIComponent(escape(atob(indexData.content)));
            var icon = SECTION_ICONS[section] || '&#x1F4C4;';
            var newEntry = buildIndexEntry(filePath, icon, title, subtitle);

            var sectionRegex = new RegExp(
                '(<div class="section-label">' + section + '</div>\\s*<ul class="page-list">)([\\s\\S]*?)(\\s*</ul>)'
            );
            var match = html.match(sectionRegex);

            if (match) {
                if (html.indexOf('href="' + filePath + '"') !== -1) {
                    var entryRegex = new RegExp(
                        '\\s*<li>\\s*<a href="' + filePath.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&') + '">[\\s\\S]*?</li>'
                    );
                    html = html.replace(entryRegex, '\n' + newEntry);
                } else {
                    html = html.replace(sectionRegex, '$1$2\n' + newEntry + '$3');
                }
            } else {
                var uploadLink = html.indexOf('<div style="margin-top: 40px;');
                if (uploadLink > -1) {
                    var newSection = '\n        <div class="section-label">' + section + '</div>\n        <ul class="page-list">\n' + newEntry + '\n        </ul>\n\n';
                    html = html.slice(0, uploadLink) + newSection + '        ' + html.slice(uploadLink);
                }
            }

            var updatedContent = btoa(unescape(encodeURIComponent(html)));
            await ghPut('index.html', updatedContent, indexData.sha, 'Update index: add ' + title);
        }

        btnUpload.addEventListener('click', async () => {
            if (!selectedFile) return;
            if (!getToken()) {
                showStatus('Primero configura tu GitHub token arriba', 'error');
                return;
            }

            var path = destFolder.value + destName.value;
            var title = indexTitle.value.trim();
            var subtitle = indexSubtitle.value.trim();
            var section = indexSection.value;

            if (!title) {
                showStatus('Introduce un t\u00edtulo para el index', 'error');
                return;
            }

            btnUpload.disabled = true;

            try {
                showStatus('Subiendo ' + path + '...', 'loading');
                var content = await readFileAndInjectGuard(selectedFile);
                var existing = await ghGet(path);
                var sha = existing ? existing.sha : null;
                await ghPut(path, content, sha, sha ? 'Update ' + path : 'Add ' + path);

                showStatus('Actualizando index...', 'loading');
                await updateIndex(path, title, subtitle, section);

                var liveUrl = 'https://lab.aldamiz.com/' + path;
                showStatus(
                    'Subido y a\u00f1adido al index.<br><a href="' + liveUrl + '" target="_blank">' + liveUrl + '</a>',
                    'success'
                );
                clearFile();
            } catch (err) {
                showStatus('Error: ' + err.message, 'error');
                btnUpload.disabled = false;
            }
        });

        function readFileAndInjectGuard(file) {
            return new Promise(function(resolve, reject) {
                var reader = new FileReader();
                reader.onload = function() {
                    var html = reader.result;
                    if (html.indexOf('guard.js') === -1) {
                        if (html.indexOf('<head>') !== -1) {
                            html = html.replace('<head>', '<head>\n    <script src="/guard.js"><\/script>');
                        } else if (html.indexOf('<HEAD>') !== -1) {
                            html = html.replace('<HEAD>', '<HEAD>\n    <script src="/guard.js"><\/script>');
                        } else {
                            html = '<script src="/guard.js"><\/script>\n' + html;
                        }
                    }
                    resolve(btoa(unescape(encodeURIComponent(html))));
                };
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }
    </script>
</body>
</html>
