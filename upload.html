<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload — Lab Aldamiz</title>
    <script src="/guard.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 60px 24px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #86868b;
            font-size: 1rem;
            margin-bottom: 32px;
        }
        .upload-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .drop-zone {
            border: 2px dashed #d2d2d7;
            border-radius: 12px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #0071e3;
            background: #f0f7ff;
        }
        .drop-zone-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }
        .drop-zone-text {
            color: #86868b;
            font-size: 0.95rem;
        }
        .drop-zone-text strong {
            color: #0071e3;
        }
        .file-info {
            display: none;
            background: #f5f5f7;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 24px;
            align-items: center;
            gap: 12px;
        }
        .file-info.visible {
            display: flex;
        }
        .file-icon { font-size: 1.5rem; }
        .file-details { flex: 1; }
        .file-name { font-weight: 600; font-size: 0.95rem; }
        .file-size { color: #86868b; font-size: 0.82rem; }
        .file-remove {
            background: none;
            border: none;
            color: #86868b;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px 8px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #86868b;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .form-group select, .form-group input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #d2d2d7;
            border-radius: 10px;
            font-size: 0.95rem;
            background: #fafafa;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group select:focus, .form-group input[type="text"]:focus {
            border-color: #0071e3;
            background: #fff;
        }
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row .form-group { flex: 1; }
        .separator {
            border: none;
            border-top: 1px solid #e8e8ed;
            margin: 24px 0;
        }
        .section-title {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #86868b;
            margin-bottom: 16px;
        }
        .btn-upload {
            width: 100%;
            padding: 14px;
            background: #1d1d1f;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-upload:hover { background: #333; }
        .btn-upload:disabled {
            background: #d2d2d7;
            cursor: not-allowed;
        }
        .status {
            margin-top: 16px;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 0.92rem;
            display: none;
        }
        .status.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
        }
        .status.error {
            display: block;
            background: #ffeef0;
            color: #d32f2f;
        }
        .status.loading {
            display: block;
            background: #e3f2fd;
            color: #1565c0;
        }
        .status a {
            color: inherit;
            font-weight: 600;
        }
        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #0071e3;
            text-decoration: none;
            font-size: 0.92rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload</h1>
        <p class="subtitle">Sube archivos HTML a lab.aldamiz.com</p>

        <div class="upload-card">
            <div class="drop-zone" id="dropZone">
                <div class="drop-zone-icon">📄</div>
                <div class="drop-zone-text">
                    Arrastra un archivo HTML aqu&iacute; o <strong>haz clic para seleccionar</strong>
                </div>
                <input type="file" id="fileInput" accept=".html,.htm" style="display:none">
            </div>

            <div class="file-info" id="fileInfo">
                <span class="file-icon">📄</span>
                <div class="file-details">
                    <div class="file-name" id="fileName"></div>
                    <div class="file-size" id="fileSize"></div>
                </div>
                <button class="file-remove" id="fileRemove">&times;</button>
            </div>

            <div class="section-title">Archivo</div>

            <div class="form-row">
                <div class="form-group">
                    <label>Nombre del archivo</label>
                    <input type="text" id="destName" placeholder="mi-pagina.html">
                </div>
                <div class="form-group">
                    <label>Carpeta</label>
                    <select id="destFolder">
                        <option value="">/ (p&uacute;blico)</option>
                        <option value="private/">private/</option>
                    </select>
                </div>
            </div>

            <hr class="separator">
            <div class="section-title">Index</div>

            <div class="form-group">
                <label>T&iacute;tulo en el index</label>
                <input type="text" id="indexTitle" placeholder="Mi dashboard">
            </div>
            <div class="form-group">
                <label>Subt&iacute;tulo</label>
                <input type="text" id="indexSubtitle" placeholder="Descripci&oacute;n corta">
            </div>
            <div class="form-group">
                <label>Secci&oacute;n</label>
                <select id="indexSection">
                    <option value="Salud">Salud</option>
                    <option value="Utilities">Utilities</option>
                </select>
            </div>

            <button class="btn-upload" id="btnUpload" disabled>Subir y a&ntilde;adir al index</button>

            <div class="status" id="status"></div>
        </div>

        <a href="index.html" class="back-link">&larr; Volver al Lab</a>
    </div>

    <script>
        const CONFIG = {
            token: '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',
            owner: 'aldamiz',
            repo: 'aldamiz-lab',
            branch: 'main'
        };

        const SECTION_ICONS = {
            'Salud': '🩸',
            'Utilities': '🔧'
        };

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const fileRemove = document.getElementById('fileRemove');
        const destName = document.getElementById('destName');
        const destFolder = document.getElementById('destFolder');
        const indexTitle = document.getElementById('indexTitle');
        const indexSubtitle = document.getElementById('indexSubtitle');
        const indexSection = document.getElementById('indexSection');
        const btnUpload = document.getElementById('btnUpload');
        const status = document.getElementById('status');

        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) handleFile(fileInput.files[0]);
        });
        fileRemove.addEventListener('click', clearFile);

        function handleFile(file) {
            if (!file.name.match(/\.html?$/i)) {
                showStatus('Solo se permiten archivos .html', 'error');
                return;
            }
            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatSize(file.size);
            fileInfo.classList.add('visible');
            destName.value = file.name;
            // Pre-fill title from filename
            const baseName = file.name.replace(/\.html?$/i, '').replace(/[-_]/g, ' ');
            indexTitle.value = baseName.charAt(0).toUpperCase() + baseName.slice(1);
            btnUpload.disabled = false;
            status.style.display = 'none';
        }

        function clearFile() {
            selectedFile = null;
            fileInfo.classList.remove('visible');
            fileInput.value = '';
            destName.value = '';
            indexTitle.value = '';
            indexSubtitle.value = '';
            btnUpload.disabled = true;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function showStatus(msg, type) {
            status.className = 'status ' + type;
            status.innerHTML = msg;
        }

        // GitHub API helpers
        async function ghGet(path) {
            const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}?ref=${CONFIG.branch}`, {
                headers: { 'Authorization': `Bearer ${CONFIG.token}` }
            });
            if (!res.ok) return null;
            return res.json();
        }

        async function ghPut(path, content, sha, message) {
            const body = { message, content, branch: CONFIG.branch };
            if (sha) body.sha = sha;
            const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${CONFIG.token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.message || 'GitHub API error');
            }
            return res.json();
        }

        function buildIndexEntry(href, icon, title, subtitle) {
            return `            <li>
                <a href="${href}">
                    <span class="page-icon">${icon}</span>
                    <div class="page-info">
                        <div class="page-title">${title}</div>
                        <div class="page-desc">${subtitle}</div>
                    </div>
                    <span class="page-arrow">›</span>
                </a>
            </li>`;
        }

        async function updateIndex(filePath, title, subtitle, section) {
            const indexData = await ghGet('index.html');
            if (!indexData) throw new Error('No se pudo leer index.html');

            let html = atob(indexData.content);
            const icon = SECTION_ICONS[section] || '📄';
            const newEntry = buildIndexEntry(filePath, icon, title, subtitle);

            // Find the section and insert before closing </ul>
            const sectionRegex = new RegExp(
                `(<div class="section-label">${section}</div>\\s*<ul class="page-list">)([\\s\\S]*?)(\\s*</ul>)`
            );
            const match = html.match(sectionRegex);

            if (match) {
                // Check if entry already exists for this file
                if (html.includes(`href="${filePath}"`)) {
                    // Replace existing entry
                    const entryRegex = new RegExp(
                        `\\s*<li>\\s*<a href="${filePath.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}">[\\s\\S]*?</li>`
                    );
                    html = html.replace(entryRegex, '\n' + newEntry);
                } else {
                    // Add new entry before </ul>
                    html = html.replace(sectionRegex, `$1$2\n${newEntry}$3`);
                }
            } else {
                // Section doesn't exist — create it before the upload link
                const uploadLink = html.indexOf('<div style="margin-top: 40px;');
                if (uploadLink > -1) {
                    const newSection = `\n        <div class="section-label">${section}</div>\n        <ul class="page-list">\n${newEntry}\n        </ul>\n\n`;
                    html = html.slice(0, uploadLink) + newSection + '        ' + html.slice(uploadLink);
                }
            }

            const updatedContent = btoa(unescape(encodeURIComponent(html)));
            await ghPut('index.html', updatedContent, indexData.sha, `Update index: add ${title}`);
        }

        btnUpload.addEventListener('click', async () => {
            if (!selectedFile) return;

            const path = destFolder.value + destName.value;
            const title = indexTitle.value.trim();
            const subtitle = indexSubtitle.value.trim();
            const section = indexSection.value;

            if (!title) {
                showStatus('Introduce un t\u00edtulo para el index', 'error');
                return;
            }

            btnUpload.disabled = true;

            try {
                // Step 1: Inject guard.js into file, then upload
                showStatus('Subiendo ' + path + '...', 'loading');
                const content = await readFileAndInjectGuard(selectedFile);
                const existing = await ghGet(path);
                const sha = existing ? existing.sha : null;
                await ghPut(path, content, sha, sha ? `Update ${path}` : `Add ${path}`);

                // Step 2: Update index
                showStatus('Actualizando index...', 'loading');
                await updateIndex(path, title, subtitle, section);

                const liveUrl = `https://lab.aldamiz.com/${path}`;
                showStatus(
                    `Subido y a\u00f1adido al index.<br><a href="${liveUrl}" target="_blank">${liveUrl}</a>`,
                    'success'
                );
                clearFile();
            } catch (err) {
                showStatus('Error: ' + err.message, 'error');
                btnUpload.disabled = false;
            }
        });

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Read HTML file, inject guard.js if not present, return base64
        function readFileAndInjectGuard(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    let html = reader.result;
                    // Only inject if not already present
                    if (html.indexOf('guard.js') === -1) {
                        // Inject after <head> or at the very start
                        if (html.indexOf('<head>') !== -1) {
                            html = html.replace('<head>', '<head>\n    <script src="/guard.js"><\/script>');
                        } else if (html.indexOf('<HEAD>') !== -1) {
                            html = html.replace('<HEAD>', '<HEAD>\n    <script src="/guard.js"><\/script>');
                        } else {
                            html = '<script src="/guard.js"><\/script>\n' + html;
                        }
                    }
                    resolve(btoa(unescape(encodeURIComponent(html))));
                };
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }
    </script>
</body>
</html>
